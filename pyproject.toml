[project]
name = "pcmonitor-agent"
version = "0.2.0"
description = "Personal Windows monitoring agent for PCMonitor"
requires-python = ">=3.12"
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=6",
    "httpx>=0.27",
    "pystray>=0.19",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pcmonitor-agent = "pcmonitor.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcmonitor = ["config.default.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
